# A private copy of the Toolshop app (practicesoftwaretesting.com) for CI.
# Based on docker-compose.prod.yml from github.com/testsmith-io/practice-software-testing,
# using the authors' prebuilt images. UI: http://localhost:4200, API: http://localhost:8091.
#
# Why: the public site is behind a Cloudflare bot check ("Performing security verification"),
# which blocks GitHub-hosted runners. Each CI shard tests its own fresh copy instead.
name: toolshop
services:
  laravel-api:
    image: testsmith/practice-software-testing-sprint5-api
    environment:
      - "PHP_OPCACHE_VALIDATE_TIMESTAMPS=1"
      - "DB_PORT=3306"
      - "DB_HOST=mariadb"
      - "host=localhost"
      - "DISABLE_LOGGING=true"
    volumes:
      - laravel-app-code:/var/www
    depends_on:
      - mariadb

  angular-ui:
    image: testsmith/practice-software-testing-sprint5-ui
    ports:
      - 4200:4200
    command: >
      bash -c "ng serve --host 0.0.0.0 --port 4200"

  # The authors' testsmith/practice-software-testing-web image is built for linux/arm64 only and
  # does not run on GitHub's amd64 runners. It is just nginx:alpine + vhost.conf, so we do the same
  # with the official multi-platform nginx image.
  web:
    image: nginx:1.27-alpine
    ports:
      - 8091:80
    volumes:
      - ./nginx-toolshop.conf:/etc/nginx/conf.d/default.conf:ro
      - laravel-app-code:/var/www:ro
    depends_on:
      - laravel-api

  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop

volumes:
  laravel-app-code:
